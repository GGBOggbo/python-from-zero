<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 学习平台 — 从零到能打</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css" id="hljs-dark" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" id="cm-dark" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <div class="logo-icon">Py</div>
      <h1>Python 学习平台</h1>
    </div>
    <p class="sidebar-subtitle">从零到能打 · 30 天速成</p>
    <div class="progress-section">
      <div class="progress-stats">
        <span class="progress-label" id="progressText">已完成 0/10 天</span>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="theme-toggle">
      <span class="theme-toggle-label" id="themeIcon">☀️</span>
      <div class="theme-switch" onclick="toggleTheme()"></div>
    </div>
  </div>
  <div class="nav-list" id="navList"></div>
</aside>

<!-- Main Content -->
<div class="main" id="mainContent">
  <div class="main-inner">
    <div class="landing">
      <div class="landing-icon">Py</div>
      <h2>Python <span>学习平台</span></h2>
      <p class="landing-desc">针对大模型运维工程师，30 天从零基础到能写自动化脚本。每天一个主题，全部围绕运维实战场景。</p>
      <div class="landing-cards">
        <div class="landing-stat">
          <div class="stat-value">30</div>
          <div class="stat-label">天课程</div>
        </div>
        <div class="landing-stat">
          <div class="stat-value">90+</div>
          <div class="stat-label">代码示例</div>
        </div>
        <div class="landing-stat">
          <div class="stat-value">90+</div>
          <div class="stat-label">练习题</div>
        </div>
      </div>
      <button class="start-btn" onclick="loadDay(1)">开始学习</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
