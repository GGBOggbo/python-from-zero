<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 学习平台 — 从零到能打</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css" id="hljs-dark" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ========== Light Theme (vLLM Recipes) ========== */
:root, [data-theme="light"] {
  --bg: #FFFFFF;
  --sidebar-bg: #FFFFFF;
  --card: rgba(255,255,255,0.4);
  --card-hover: rgba(255,255,255,0.6);
  --card-solid: #FFFFFF;
  --border: #E8E8F0;
  --border-subtle: rgba(31,31,61,0.15);
  --text: #1F1F3D;
  --text-secondary: #3B4B7C;
  --text-muted: #8B96B3;
  --accent: #30A2FF;
  --accent-hover: #0B7FD6;
  --accent-active: #0963AA;
  --accent-muted: rgba(48,162,255,0.1);
  --accent-focus: rgba(48,162,255,0.1);
  --warning: #FDB517;
  --warning-muted: rgba(253,181,23,0.15);
  --green: #22C55E;
  --green-muted: rgba(34,197,94,0.12);
  --red: #EF4444;
  --red-muted: rgba(239,68,68,0.1);
  --code-bg: #F5F6FA;
  --code-border: #E8E8F0;
  --surface: #F5F6FA;
  --surface-hover: #E8E8F0;
  --shadow-sm: rgba(0,0,0,0.05) 0px 1px 3px 0px;
  --shadow-md: rgba(0,0,0,0.1) 0px 4px 12px 0px;
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
}

/* ========== Dark Theme (vLLM Recipes - Exact Values) ========== */
/* Extracted from .dark{} in vLLM CSS:
   --background: oklch(12.9% .042 264.695) ≈ #131320
   --foreground: oklch(98.4% .003 247.858) ≈ #f8f9fc
   --card:        oklch(20.8% .042 265.755) ≈ #1a1d2e
   --muted:       oklch(27.9% .041 260.031) ≈ #232740
   --muted-fg:    oklch(70.4% .04  256.788) ≈ #7c8db5
   --code-bg:     oklch(24.5% .016 258)      ≈ #1e2030
   --code-block:  oklch(20%   .018 260)      ≈ #191c2a
   --command-bg:  oklch(17.5% .018 258)      ≈ #15172a
   --scrollbar:   oklch(14%   .018 260)      ≈ #111422
   --ring:        oklch(55.1% .027 264.364)  ≈ #5a6690
*/
[data-theme="dark"] {
  --bg: #131320;
  --sidebar-bg: #111422;
  --card: rgba(26,29,46,0.6);
  --card-hover: rgba(26,29,46,0.9);
  --card-solid: #1a1d2e;
  --border: rgba(255,255,255,0.1);
  --border-subtle: rgba(255,255,255,0.06);
  --text: #f8f9fc;
  --text-secondary: #7c8db5;
  --text-muted: #5a6690;
  --accent: #30A2FF;
  --accent-hover: #4DB2FF;
  --accent-active: #6BC1FF;
  --accent-muted: rgba(48,162,255,0.12);
  --accent-focus: rgba(48,162,255,0.15);
  --warning: #FDB517;
  --warning-muted: rgba(253,181,23,0.12);
  --green: #22C55E;
  --green-muted: rgba(34,197,94,0.12);
  --red: #EF4444;
  --red-muted: rgba(239,68,68,0.12);
  --code-bg: #1e2030;
  --code-border: rgba(255,255,255,0.08);
  --surface: rgba(35,39,64,0.5);
  --surface-hover: rgba(35,39,64,0.8);
  --shadow-sm: rgba(0,0,0,0.3) 0px 1px 3px 0px;
  --shadow-md: rgba(0,0,0,0.4) 0px 4px 12px 0px;
  --nav-hover-bg: rgba(255,255,255,0.05);
  --nav-active-bg: rgba(48,162,255,0.1);
}

[data-theme="dark"] .nav-item:hover { background: var(--nav-hover-bg); }
[data-theme="dark"] .nav-item.active { background: var(--nav-active-bg); }

[data-theme="dark"] .header-tag {
  background: rgba(35,39,64,0.6);
  border-color: rgba(255,255,255,0.08);
  color: var(--text-secondary);
}
[data-theme="dark"] .header-tag.blue { background: var(--accent-muted); color: var(--accent); border-color: rgba(48,162,255,0.2); }
[data-theme="dark"] .header-tag.green { background: var(--green-muted); color: var(--green); border-color: rgba(34,197,94,0.2); }
[data-theme="dark"] .header-tag.amber { background: var(--warning-muted); color: var(--warning); border-color: rgba(253,181,23,0.2); }

[data-theme="dark"] .nav-badge {
  background: rgba(35,39,64,0.6);
  border-color: rgba(255,255,255,0.06);
}

[data-theme="dark"] .exercise-box {
  background: rgba(26,29,46,0.4);
  border-color: rgba(255,255,255,0.06);
}

[data-theme="dark"] .editor-textarea {
  background: #191c2a;
  border-color: rgba(255,255,255,0.08);
}

[data-theme="dark"] .editor-output {
  background: #191c2a;
  border-color: rgba(255,255,255,0.08);
}

[data-theme="dark"] .progress-track {
  background: rgba(35,39,64,0.6);
}

[data-theme="dark"] .theme-switch {
  background: rgba(35,39,64,0.6);
  border-color: rgba(255,255,255,0.08);
}

[data-theme="dark"] .landing-stat {
  background: rgba(26,29,46,0.4);
  border-color: rgba(255,255,255,0.06);
}

[data-theme="dark"] .table-wrap {
  border-color: rgba(255,255,255,0.06);
}

[data-theme="dark"] th {
  background: rgba(26,29,46,0.5);
}

[data-theme="dark"] .code-block {
  background: #191c2a;
  border-color: rgba(255,255,255,0.06);
}

[data-theme="dark"] .copy-btn {
  border-color: rgba(255,255,255,0.08);
  color: var(--text-muted);
}

[data-theme="dark"] .copy-btn:hover {
  background: rgba(35,39,64,0.6);
  border-color: var(--accent);
  color: var(--accent);
}

/* Scrollbar matching vLLM dark: oklch(30% .015 260) thumb, oklch(14% .018 260) track */
[data-theme="dark"] .main::-webkit-scrollbar-thumb { background: #252840; }
[data-theme="dark"] .main::-webkit-scrollbar-track { background: #111422; }
[data-theme="dark"] .nav-list::-webkit-scrollbar-thumb { background: #252840; }
[data-theme="dark"] .nav-list::-webkit-scrollbar-track { background: #111422; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ========== Sidebar ========== */
.sidebar {
  width: 272px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}

.sidebar-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-logo .logo-icon {
  width: 32px;
  height: 32px;
  background: var(--accent);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
}

.sidebar-logo h1 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.sidebar-subtitle {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
  padding-left: 42px;
}

.progress-section {
  margin-top: 16px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.progress-label {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
}

.progress-pct {
  font-size: 12px;
  color: var(--accent);
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}

.progress-track {
  height: 4px;
  background: var(--surface);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
}

/* Theme toggle */
.theme-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 6px 0;
}

.theme-toggle-label {
  font-size: 12px;
  color: var(--text-muted);
}

.theme-switch {
  position: relative;
  width: 36px;
  height: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s;
}

.theme-switch::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  background: var(--text-secondary);
  border-radius: 50%;
  transition: all 0.2s;
}

[data-theme="dark"] .theme-switch {
  background: var(--accent-muted);
  border-color: var(--accent);
}

[data-theme="dark"] .theme-switch::after {
  left: 18px;
  background: var(--accent);
}

/* Nav */
.nav-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.nav-list::-webkit-scrollbar { width: 4px; }
.nav-list::-webkit-scrollbar-track { background: transparent; }
.nav-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.nav-section {
  padding: 16px 12px 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: color 0.2s, background 0.2s;
  font-size: 14px;
  font-weight: 400;
  color: var(--text-secondary);
  user-select: none;
}

.nav-item:hover {
  background: var(--surface);
  color: var(--accent);
}

.nav-item.active {
  color: var(--accent);
  font-weight: 600;
  background: var(--accent-muted);
}

.nav-icon {
  width: 22px;
  height: 22px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  flex-shrink: 0;
  transition: all 0.15s;
  font-family: 'JetBrains Mono', monospace;
}

.nav-icon.pending {
  background: var(--surface);
  color: var(--text-muted);
}

.nav-icon.current {
  background: var(--accent);
  color: #fff;
}

.nav-icon.done {
  background: var(--green);
  color: #fff;
}

.nav-label {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-badge {
  font-size: 13px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
}

/* ========== Main Content ========== */
.main {
  flex: 1;
  overflow-y: auto;
  background: var(--bg);
}

.main::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.main-inner {
  max-width: 860px;
  margin: 0 auto;
  padding: 48px 48px 80px;
}

/* Content Header */
.content-header {
  margin-bottom: 40px;
}

.header-tags {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.header-tag {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
}

.header-tag.blue { background: var(--accent-muted); color: var(--accent); border-color: rgba(48,162,255,0.25); }
.header-tag.green { background: var(--green-muted); color: var(--green); border-color: rgba(34,197,94,0.25); }
.header-tag.amber { background: var(--warning-muted); color: #B8860B; border-color: rgba(253,181,23,0.3); }

[data-theme="dark"] .header-tag.amber { color: var(--warning); }

.content-header h2 {
  font-size: 30px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
  line-height: 1.2;
  color: var(--text);
}

.content-header .desc {
  color: var(--text-secondary);
  font-size: 16px;
  line-height: 1.5;
  font-weight: 300;
}

/* Sections */
.section {
  margin-bottom: 36px;
}

.section-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  line-height: 35px;
}

.section-num {
  background: var(--accent);
  color: #fff;
  width: 24px;
  height: 24px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace;
}

/* Text blocks */
.text-block {
  line-height: 24px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  font-size: 14px;
}

.text-block strong {
  color: var(--text);
  font-weight: 600;
}

.text-block code {
  font-family: 'JetBrains Mono', monospace;
  background: var(--surface);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
  color: var(--accent);
}

/* Code blocks */
.code-block {
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  border-radius: var(--radius);
  margin: 14px 0;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.code-header {
  padding: 8px 16px;
  background: var(--surface);
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  font-family: 'Inter', sans-serif;
}

.code-header .lang-label {
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.copy-btn {
  cursor: pointer;
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 400;
  font-family: 'Inter', sans-serif;
  transition: all 0.2s;
}

.copy-btn:hover {
  background: var(--surface);
  color: var(--accent);
  border-color: var(--accent);
}

.code-block pre {
  margin: 0;
  padding: 16px;
  overflow-x: auto;
}

.code-block code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 21px;
}

/* Tip boxes */
.tip-box {
  padding: 14px 18px;
  border-radius: var(--radius);
  margin: 14px 0;
  border-left: 3px solid;
  font-size: 14px;
  line-height: 20px;
}

.tip-box.info { background: var(--accent-muted); border-color: var(--accent); }
.tip-box.warn { background: var(--warning-muted); border-color: var(--warning); }
.tip-box.success { background: var(--green-muted); border-color: var(--green); }
.tip-box.danger { background: var(--red-muted); border-color: var(--red); }

.tip-box p { color: var(--text-secondary); }
.tip-box strong { color: var(--text); }

/* Tables */
.table-wrap {
  overflow-x: auto;
  margin: 12px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th {
  padding: 10px 16px;
  text-align: left;
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--surface);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border-bottom: 1px solid var(--border);
}

td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
  line-height: 20px;
}

tr:last-child td { border-bottom: none; }

td code {
  font-family: 'JetBrains Mono', monospace;
  background: var(--surface);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
  color: var(--accent);
}

/* Exercise boxes */
.exercise-box {
  background: var(--card-solid);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  margin: 16px 0;
  box-shadow: var(--shadow-sm);
  transition: background 0.2s, box-shadow 0.2s;
}

.exercise-box:hover {
  background: var(--card-hover);
  box-shadow: var(--shadow-md);
}

.exercise-box h4 {
  color: var(--text);
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 600;
}

.exercise-box p {
  color: var(--text-secondary);
  margin-bottom: 16px;
  line-height: 20px;
  font-size: 14px;
}

.check-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  transition: all 0.2s;
}

.check-btn.unchecked {
  background: transparent;
  color: var(--text-secondary);
}

.check-btn.unchecked:hover {
  background: var(--surface);
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}

.check-btn.checked {
  background: var(--green-muted);
  color: var(--green);
  border-color: rgba(34,197,94,0.3);
}

/* Nav buttons */
.nav-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}

.nav-btn {
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 400;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  height: 36px;
  line-height: 20px;
}

.nav-btn.secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
}

.nav-btn.secondary:hover {
  background: var(--surface);
  border-color: var(--accent);
  color: var(--accent);
}

.nav-btn.primary {
  background: var(--accent);
  border: none;
  color: #fff;
  box-shadow: var(--shadow-sm);
}

.nav-btn.primary:hover {
  background: var(--accent-hover);
  box-shadow: rgba(48,162,255,0.2) 0px 4px 12px 0px;
}

.nav-btn.primary:active {
  background: var(--accent-active);
  transform: scale(0.98);
}

/* ========== Landing Page ========== */
.landing {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100%;
  text-align: center;
  padding: 48px;
}

.landing-icon {
  width: 64px;
  height: 64px;
  background: var(--accent);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 24px;
  font-family: 'JetBrains Mono', monospace;
}

.landing h2 {
  font-size: 30px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: -0.02em;
  margin-bottom: 12px;
}

.landing h2 span { color: var(--accent); }

.landing .landing-desc {
  color: var(--text-secondary);
  font-size: 16px;
  font-weight: 300;
  max-width: 480px;
  line-height: 24px;
  margin-bottom: 32px;
}

.landing-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  max-width: 480px;
  width: 100%;
  margin-bottom: 32px;
}

.landing-stat {
  background: var(--card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px 16px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  transition: background 0.2s, box-shadow 0.2s;
}

.landing-stat:hover {

// ====== Theme ======
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  localStorage.setItem('py_theme', next);
  document.getElementById('themeIcon').textContent = next === 'light' ? '☀️' : '🌙';

  // Switch highlight.js theme
  const lightSheet = document.getElementById('hljs-light');
  const darkSheet = document.getElementById('hljs-dark');
  if (next === 'dark') {
    lightSheet.disabled = true;
    darkSheet.disabled = false;
  } else {
    lightSheet.disabled = false;
    darkSheet.disabled = true;
  }

  // Re-highlight
  document.querySelectorAll('pre code').forEach(el => {
    el.removeAttribute('data-highlighted');
    hljs.highlightElement(el);
  });
}

// Restore theme
(function() {
  const saved = localStorage.getItem('py_theme');
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeIcon').textContent = saved === 'light' ? '☀️' : '🌙';
    if (saved === 'dark') {

// ====== State ======
let completed = JSON.parse(localStorage.getItem('py_progress') || '{}');

function saveProgress() {
  localStorage.setItem('py_progress', JSON.stringify(completed));
  updateProgress();
}

function updateProgress() {
  const done = Object.keys(completed).filter(k => !k.includes('_') && completed[k]).length;
  const pct = Math.round(done / 10 * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `已完成 ${done}/10 天`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.querySelectorAll('.nav-item').forEach(el => {
    const id = parseInt(el.dataset.id);
    const icon = el.querySelector('.nav-icon');
    if (completed[id]) {
      icon.className = 'nav-icon done';
      icon.textContent = '✓';
    } else if (id === getCurrentDay()) {
      icon.className = 'nav-icon current';
      icon.textContent = courses.find(c=>c.id===id).icon;
    } else {
      icon.className = 'nav-icon pending';
      icon.textContent = courses.find(c=>c.id===id).icon;
    }
  });
}

function getCurrentDay() {
  for (let i = 1; i <= 10; i++) {
    if (!completed[i]) return i;
  }
  return 10;
}

// ====== Render Nav ======
function renderNav() {
  const nav = document.getElementById('navList');
  let html = '<div class="nav-section">基础阶段</div>';
  courses.forEach(c => {
    if (c.id === 5) html += '<div class="nav-section">核心阶段</div>';
    if (c.id === 9) html += '<div class="nav-section">进阶阶段</div>';
    const isActive = c.id === getCurrentDay() ? 'active' : '';
    html += `<div class="nav-item ${isActive}" data-id="${c.id}" onclick="loadDay(${c.id})">
      <span class="nav-icon pending">${c.icon}</span>
      <span class="nav-label">Day ${c.id} ${c.title}</span>
      <span class="nav-badge">${c.tag}</span>
    </div>`;
  });
  nav.innerHTML = html;
}

// ====== Render Content ======
function loadDay(id) {
  const c = courses.find(x => x.id === id);
  if (!c) return;

  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.id) === id);
  });

  let html = `<div class="content-header">
    <div class="header-tags">
      <span class="header-tag ${c.tagClass}">Day ${c.id}</span>
      <span class="header-tag ${c.tagClass}">${c.tag}</span>
    </div>
    <h2>${c.title}</h2>
    <p class="desc">${c.desc}</p>
  </div>`;

  c.sections.forEach((s, i) => {
    html += `<div class="section">
      <h3 class="section-title"><span class="section-num">${i+1}</span> ${s.title}</h3>
      ${s.content}
    </div>`;
  });

  if (c.exercises.length) {
    html += `<div class="section"><h3 class="section-title"><span class="section-num" style="background:var(--warning);">✎</span> 练习</h3>`;
    c.exercises.forEach((ex, i) => {
      html += `<div class="exercise-box">
        <h4>练习 ${i+1}: ${ex.title}</h4>
        <p>${ex.desc}</p>
        <div class="code-editor">
          <textarea class="editor-textarea" id="editor-${id}-${i}" placeholder="# 在这里写你的 Python 代码&#10;# 点击「运行」看结果" spellcheck="false">${(ex.starter || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea>
          <div class="editor-actions">
            <button class="run-btn" onclick="runEditorCode(${id}, ${i}, this)">▶ 运行</button>
          </div>
          <div class="editor-output" id="output-${id}-${i}"></div>
        </div>
        <hr class="exercise-divider">
        <div class="answer-section" id="answer-${id}-${i}" style="display:none;">
          <div class="answer-header">参考答案</div>
          <pre><code class="language-python">${(ex.answer || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>
        </div>
        <div class="exercise-bottom-actions">
          <button class="answer-btn" onclick="toggleAnswer(${id}, ${i}, this)">
            👁 参考答案
          </button>
          <button class="check-btn ${completed[`${id}_${i}`] ? 'checked' : 'unchecked'}"
            onclick="toggleExercise(${id}, ${i}, this)">
            ${completed[`${id}_${i}`] ? '✓ 已完成' : '标记完成'}
          </button>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="nav-buttons">`;
  html += id > 1 ? `<button class="nav-btn secondary" onclick="loadDay(${id-1})">← Day ${id-1}</button>` : '<div></div>';
  html += id < 10 ? `<button class="nav-btn primary" onclick="loadDay(${id+1})">Day ${id+1} →</button>` : '<div></div>';
  html += `</div>`;

  document.getElementById('mainContent').innerHTML = `<div class="main-inner">${html}</div>`;
  document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  document.getElementById('mainContent').scrollTop = 0;
}

function toggleExercise(dayId, exIdx, btn) {
  const key = `${dayId}_${exIdx}`;
  completed[key] = !completed[key];
  btn.className = `check-btn ${completed[key] ? 'checked' : 'unchecked'}`;
  btn.textContent = completed[key] ? '✓ 已完成' : '标记完成';

  const c = courses.find(x => x.id === dayId);
  const allDone = c.exercises.every((_, i) => completed[`${dayId}_${i}`]);
  completed[dayId] = allDone;
  saveProgress();
}

function copyCode(btn) {
  const code = btn.closest('.code-block').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

// ====== Server-side Python Execution ======
async function runEditorCode(dayId, exIdx, btn) {
  const editor = document.getElementById(`editor-${dayId}-${exIdx}`);
  const output = document.getElementById(`output-${dayId}-${exIdx}`);
  const code = editor.value.trim();

  if (!code) {
    output.innerHTML = '<span class="system">请先写点代码再运行</span>';
    output.classList.add('visible');
    return;
  }

  btn.disabled = true;
  btn.textContent = '运行中...';

  try {
    const resp = await fetch("/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code }),
    });
    const result = await resp.json();

    let html = '';
    if (result.stdout) html += `<span class="stdout">${escapeHtml(result.stdout)}</span>`;
    if (result.stderr) html += `<span class="stderr">${escapeHtml(result.stderr)}</span>`;
    if (!result.stdout && !result.stderr) html += '<span class="system">（代码运行完毕，无输出）</span>';

    output.innerHTML = html;
    output.classList.add('visible');
  } catch (e) {
    output.innerHTML = `<span class="stderr">连接服务器失败: ${e.message}</span>`;
    output.classList.add('visible');
  }

  btn.disabled = false;
  btn.textContent = '▶ 运行';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Tab key support for textareas
document.addEventListener('keydown', function(e) {
  if (e.target.classList.contains('editor-textarea') && e.key === 'Tab') {
    e.preventDefault();
    const start = e.target.selectionStart;
    const end = e.target.selectionEnd;
    e.target.value = e.target.value.substring(0, start) + '    ' + e.target.value.substring(end);
    e.target.selectionStart = e.target.selectionEnd = start + 4;
  }
});


function toggleAnswer(dayId, exIdx, btn) {
  const el = document.getElementById(`answer-${dayId}-${exIdx}`);
  if (el.style.display === 'none') {
    el.style.display = 'block';
    btn.textContent = '👁 隐藏答案';
    // Highlight the code
    el.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
  } else {
    el.style.display = 'none';
    btn.textContent = '👁 参考答案';
  }
}

// ====== Init ======
renderNav();
updateProgress();
</script>
